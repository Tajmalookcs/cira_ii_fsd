{% extends "base/base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="panel text-center">
            <div class="panel-body py-5">
                <i class="bi bi-search" style="font-size:44px;color:var(--fbr-green);opacity:.4;"></i>
                <h1 class="page-title mt-3">Page Not Found</h1>
                <p class="text-muted" style="font-size:14px;">
                    The page or record you asked for does not exist. It may have been
                    deleted, or the address may be mistyped.
                </p>
                <a href="{% url 'core:dashboard' %}" class="btn btn-fbr mt-2">
                    <i class="bi bi-house me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
